name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi
          arm-none-eabi-gcc --version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Python tools
        run: pip install -r requirements-dev.txt

      - name: Build (warnings are errors) + ISA audit
        run: make WERROR=1 audit disasm

      - name: Lint
        run: make lint

      # Ricoh's stock firmware is downloaded (SHA-256 checked) for the emulator and the loader
      # check; it is cached, never committed and never uploaded.
      - name: Cache stock firmware
        uses: actions/cache@v4
        with:
          path: fw
          key: fw-rg2_v003-3643850f2ae74ae9

      - name: Stock firmware
        run: make fw

      - name: Emulator tests
        run: make emu EMU_ARGS="--render renders"

      - name: Loader .frm build + check
        run: make loader

      - name: SD bundles
        run: |
          make dist
          cd dist && sha256sum -c SHA256SUMS.txt

      - name: Summary
        run: |
          {
            echo "### gr2_cfw v$(tr -d '[:space:]' < VERSION)"
            echo '```'
            arm-none-eabi-size bin/*/gr2_*.elf
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: sd-bundles
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: elf-renders
          path: |
            bin/*/gr2_*.elf
            bin/*/gr2_*.asm
            renders/*.png
