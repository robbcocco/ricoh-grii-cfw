name: Release (bump version, publish SD bundles)

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'SemVer bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: 'Explicit version (e.g. 0.2.0); leave blank to use the bump type'
        required: false
        default: ''
        type: string

jobs:
  publish-release:
    name: Bump version, build, publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ARM GNU bare-metal toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Bump version
        id: bump
        run: |
          if [ -n "${{ inputs.custom_version }}" ]; then
            BUMP_ARG="${{ inputs.custom_version }}"
          else
            BUMP_ARG="${{ inputs.bump_type }}"
          fi
          python3 scripts/bump_version.py "$BUMP_ARG"
          NEW_VER=$(tr -d '[:space:]' < VERSION)
          echo "version=$NEW_VER" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VER" >> $GITHUB_OUTPUT

      - name: Build both variants
        run: make clean all

      - name: Package SD bundles
        run: python3 scripts/package_sd.py

      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS.txt

      - name: Commit version bump and release notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION dist/RELEASE_NOTES.md dist/SHA256SUMS.txt
          git commit -m "chore(release): ${{ steps.bump.outputs.tag }}"
          git tag ${{ steps.bump.outputs.tag }}
          git push origin main
          git push origin ${{ steps.bump.outputs.tag }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: "gr2_cfw ${{ steps.bump.outputs.tag }}"
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/gr2_cfw-v*-release.zip
            dist/gr2_cfw-v*-debug.zip
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
