name: 3. Release (Manual Version Bump & GitHub Release)

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'SemVer Bump Type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: 'Custom Version Override (e.g. 0.2.0, leaves blank to use bump type)'
        required: false
        default: ''
        type: string

jobs:
  create-release:
    name: Bump Version & Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ARM GNU Bare-Metal Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Bump Version
        id: bump
        run: |
          if [ -n "${{ inputs.custom_version }}" ]; then
            BUMP_ARG="${{ inputs.custom_version }}"
          else
            BUMP_ARG="${{ inputs.bump_type }}"
          fi
          python3 scripts/bump_version.py "$BUMP_ARG"
          NEW_VER=$(cat VERSION | tr -d '[:space:]')
          echo "version=$NEW_VER" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VER" >> $GITHUB_OUTPUT

      - name: Compile Bare-Metal ARM Payload
        run: |
          make clean all disasm

      - name: Build Firmware Release Package
        env:
          CI: "true"
        run: |
          python3 scripts/build_release.py --skip-sd-check

      - name: Validate Checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt

      - name: Commit Version Bump & Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION dist/RELEASE_NOTES.md dist/SHA256SUMS.txt
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.tag }}"
          git tag ${{ steps.bump.outputs.tag }}
          git push origin main
          git push origin ${{ steps.bump.outputs.tag }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: "Ricoh GR II Custom Firmware ${{ steps.bump.outputs.tag }}"
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.frm
            dist/*.bin
            dist/SHA256SUMS.txt
            bin/gr2_cfw.elf
          draft: false
          prerelease: false
