name: Build & Package CFW

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build release + debug, package SD bundles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM GNU bare-metal toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi
          arm-none-eabi-gcc --version

      - name: Build both variants
        run: make clean all disasm

      - name: Size & ISA audit
        run: |
          echo "### Payload size (v$(tr -d '[:space:]' < VERSION))" >> $GITHUB_STEP_SUMMARY
          echo "| Variant | Stage | .text | .data | .bss | bin |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          for v in release debug; do
            for s in cfw main; do
              ELF=bin/$v/gr2_$s.elf
              sz() { arm-none-eabi-size -A $ELF | awk -v s="$1" '$1==s{print $2}'; }
              BIN=$(stat -c%s bin/$v/gr2_$s.bin)
              echo "| $v | gr2_$s | $(sz .text) | $(sz .data) | $(sz .bss) | $BIN |" >> $GITHUB_STEP_SUMMARY
              # gr2_boot.ld asserts the window layout; the camera CPU is ARMv5TE, Thumb-1 only.
              arm-none-eabi-readelf -A $ELF | grep -q 'Tag_CPU_arch: v5TE'
              arm-none-eabi-readelf -A $ELF | grep -q 'Tag_THUMB_ISA_use: Thumb-1'
            done
          done

      # The firmware image is not in the repo, so this is a skip in CI; it runs the
      # Unicorn scenarios wherever fw/b01firm8.bin (or GR2_FW) exists.
      - name: Emulator smoke test (skips without the firmware image)
        run: |
          if [ -f "${GR2_FW:-fw/b01firm8.bin}" ]; then pip install unicorn pillow numpy; fi
          make emu

      - name: Package SD bundles
        run: python3 scripts/package_sd.py

      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS.txt

      - name: Upload SD bundles
        uses: actions/upload-artifact@v4
        with:
          name: gr2_cfw-sd-bundles
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md

      - name: Upload ELF + disassembly (debugging)
        uses: actions/upload-artifact@v4
        with:
          name: gr2_cfw-elf
          path: |
            bin/*/gr2_*.elf
            bin/*/gr2_*.asm
